name: location_marker
description: "地点标记 App —— 本地地点记录（内置数据库，不依赖任何服务端）"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 本地存储：sqflite 内置数据库 + 应用私有目录存照片与录音
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # 设备能力（均为系统能力，不接任何第三方服务端）
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  image_picker: ^1.1.2
  record: ^7.1.1
  just_audio: ^0.10.6
  speech_to_text: ^7.0.0
  permission_handler: ^12.0.1
  uuid: ^4.4.0
  amap_map: ^1.0.15
  x_amap_base: ^1.0.3
  url_launcher: ^6.3.1

dependency_overrides:
  # 上游 amap_map 1.0.15 的 android 模块写死 compileSdkVersion 35，
  # 与要求编译到 36 的依赖冲突，用打了补丁的本地副本，见
  # third_party/amap_map/PATCH.md
  amap_map:
    path: third_party/amap_map

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
