name: location_marker
description: "地点标记 App —— 本地地点记录（内置数据库，不依赖任何服务端）"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 本地存储：sqflite 内置数据库 + 应用私有目录存照片与录音
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # 设备能力（均为系统能力，不接任何第三方服务端）
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  record: ^5.1.2
  just_audio: ^0.9.40
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  uuid: ^4.4.0
  amap_map: ^1.0.15
  x_amap_base: ^1.0.3
  url_launcher: ^6.3.1

dependency_overrides:
  # amap_map 的 android 模块写死 compileSdkVersion 35，而
  # flutter_plugin_android_lifecycle 2.0.27+ 在 AAR metadata 里要求
  # 依赖方编译到 36，构建会在 checkReleaseAarMetadata 阶段失败。
  # 固定到最后一个用 35 的版本，保持两者一致。
  flutter_plugin_android_lifecycle: 2.0.26

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
