name: location_marker
description: "踩点 —— 把去过的地方记下来（本地优先，可选云端同步）"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 本地存储：sqflite 内置数据库 + 应用私有目录存照片与录音
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # 设备能力（均为系统能力，不接任何第三方服务端）
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  image_picker: ^1.1.2
  record: ^7.1.1
  just_audio: ^0.10.6
  speech_to_text: ^7.0.0
  permission_handler: ^12.0.1
  uuid: ^4.4.0
  amap_map: ^1.0.15
  x_amap_base: ^1.0.3
  url_launcher: ^6.3.1

  # 检查更新与云端同步用。这是本仓库第一个联网依赖——在此之前 App
  # 除了高德 SDK 拉瓦片之外不发任何网络请求。
  http: ^1.2.2
  crypto: ^3.0.5
  package_info_plus: ^10.2.1

dependency_overrides:
  # 上游 amap_map 1.0.15 的 android 模块写死 compileSdkVersion 35，
  # 与要求编译到 36 的依赖冲突，用打了补丁的本地副本，见
  # third_party/amap_map/PATCH.md
  amap_map:
    path: third_party/amap_map

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    # 应用图标的原稿。启动图标由 scripts/make-launcher-icons.py 从它生成，
    # 留在这里是为了以后改图标时有据可依。
    - assets/logo.png
