name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/location-marker-app-ui-cab78c

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # AGP 8.x 需要 JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter SDK
        run: |
          set -euo pipefail
          curl -fsSL -o flutter.tar.xz \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz
          tar xf flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: 环境信息
        run: |
          flutter --version
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"

      # 高德 Key 从仓库 Secrets 取（没配也能构建，地图会退回本地示意图）。
      # 这个文件在 .gitignore 里，只存在于 CI 的工作目录。
      - name: 写入高德 Key
        env:
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
          AMAP_IOS_KEY: ${{ secrets.AMAP_IOS_KEY }}
        run: |
          printf 'AMAP_ANDROID_KEY=%s\nAMAP_IOS_KEY=%s\n' \
            "${AMAP_ANDROID_KEY:-}" "${AMAP_IOS_KEY:-}" > android/amap.properties
          if [ -n "${AMAP_ANDROID_KEY:-}" ]; then
            echo "已注入 Android 端高德 Key"
          else
            echo "::warning::未配置 AMAP_ANDROID_KEY，APK 里的地图会显示为本地示意图"
          fi

      # 配了 ANDROID_KEYSTORE_BASE64 就用固定签名，否则退回 debug 签名。
      # 高德 Key 绑「包名 + 签名 SHA1」，debug keystore 由构建机现场生成，
      # 每次换 runner 都是新的 SHA1，用户注册好的 Key 会失效。
      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次用 debug 签名，\
          签名 SHA1 每次构建都会变；要让用户自己填高德 Key，需要固定签名"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=app/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          PROPS
          echo "已启用固定的 release 签名"

      # 78 MB 的中文语音模型，不在仓库里，构建前拉一次。
      # 拉不到就让构建挂掉：静悄悄打出一个「录音能录但转不出字」的包，
      # 装到手机上才发现，比在这儿红一次糟糕得多。
      - name: 下载离线语音模型
        run: bash scripts/fetch-asr-model.sh

      - name: 拉依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试与 widget 测试
        run: flutter test

      - name: 构建 Release APK
        env:
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
          AMAP_IOS_KEY: ${{ secrets.AMAP_IOS_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=AMAP_ANDROID_KEY="${AMAP_ANDROID_KEY:-}" \
            --dart-define=AMAP_IOS_KEY="${AMAP_IOS_KEY:-}"
          ls -lh build/app/outputs/flutter-apk/

      # 这次闪退就是 R8 把高德的类改了名，而它的原生库 JNI_OnLoad 按原始
      # 名字 FindClass，拿到 null 后直接 abort。没有真机也能在这里验出来。
      - name: 校验高德的类没被混淆掉
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk

          if unzip -p "$apk" 'classes*.dex' |
              grep -aq 'Lcom/autonavi/amap/mapcore/MsgProcessor;'; then
            echo "OK：MsgProcessor 以原始类名保留在 dex 里"
          else
            echo "::error::高德的 MsgProcessor 被改名或已被剔除，打开地图会闪退"
            exit 1
          fi

          if unzip -l "$apk" | grep -qE 'lib/arm64-v8a/libAMapSDK_MAP'; then
            echo "OK：arm64 的高德原生库已打进包里"
          else
            echo "::error::APK 里没有高德的原生库"
            exit 1
          fi

      # 语音模型和它的原生库有没有真的进包。少了任何一样，录音都还能录，
      # 但转不出文字——这种缺失不会让构建失败，只会让用户白等，所以在这查。
      - name: 校验语音模型进包了
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk

          if unzip -l "$apk" | grep -q 'assets/flutter_assets/assets/asr/model.int8.onnx'; then
            echo "OK：语音模型已打进包里"
          else
            echo "::error::APK 里没有语音模型，录音将无法转文字"
            exit 1
          fi

          for abi in arm64-v8a armeabi-v7a; do
            if unzip -l "$apk" | grep -q "lib/$abi/libsherpa-onnx-c-api.so"; then
              echo "OK：$abi 的 sherpa-onnx 原生库已打进包里"
            else
              echo "::error::APK 里没有 $abi 的 sherpa-onnx 原生库"
              exit 1
            fi
          done

          # abiFilters 没生效的话 x86/x86_64 那 61 MB 会白白进包。
          # 只有模拟器用得上，装到手机里纯属浪费。
          if unzip -l "$apk" | grep -qE 'lib/(x86|x86_64)/'; then
            echo "::error::APK 里还带着 x86 的原生库，abiFilters 没生效"
            unzip -l "$apk" | grep -E 'lib/(x86|x86_64)/' | head
            exit 1
          fi
          echo "OK：x86 的原生库已被排除"

          echo "各 ABI 占用："
          unzip -l "$apk" | awk '/lib\//{split($4,a,"/"); s[a[2]]+=$1} END{for(k in s) printf "  %-14s %6.1f MB\n", k, s[k]/1048576}'

      # 把签名证书的 SHA1 打出来：到高德开放平台建 Key 时要填这个值。
      # 直接读打出来的 APK，而不是读 keystore 文件——这才是使用者实际拿到的签名。
      - name: 打印签名 SHA1
        run: |
          set -uo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          if [ -f android/key.properties ]; then
            echo "签名来源：固定的 release keystore，每次构建一致"
          else
            echo "::warning::本次是 debug 签名，SHA1 每次构建都会变；\
          要让使用者各自填高德 Key，请配置 ANDROID_KEYSTORE_BASE64 等 Secret"
          fi

          # minSdk 24 时 AGP 可能只做 v2/v3 签名，APK 里没有 META-INF 的 JAR 签名块，
          # keytool -jarfile 会读不到，所以优先用 apksigner。
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null |
            sort -V | tail -1)
          if [ -n "$apksigner" ]; then
            echo "用 $apksigner 读取："
            "$apksigner" verify --print-certs "$apk" | grep -Ei 'SHA-1|SHA-256'
          else
            echo "没找到 apksigner，改用 keytool："
            keytool -printcert -jarfile "$apk" | grep -E 'SHA1|SHA256'
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: location-marker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
