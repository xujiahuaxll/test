name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/location-marker-app-ui-cab78c

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # AGP 8.x 需要 JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter SDK
        run: |
          set -euo pipefail
          curl -fsSL -o flutter.tar.xz \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz
          tar xf flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: 环境信息
        run: |
          flutter --version
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"

      # 高德 Key 从仓库 Secrets 取（没配也能构建，地图会退回本地示意图）。
      # 这个文件在 .gitignore 里，只存在于 CI 的工作目录。
      - name: 写入高德 Key
        env:
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
          AMAP_IOS_KEY: ${{ secrets.AMAP_IOS_KEY }}
        run: |
          printf 'AMAP_ANDROID_KEY=%s\nAMAP_IOS_KEY=%s\n' \
            "${AMAP_ANDROID_KEY:-}" "${AMAP_IOS_KEY:-}" > android/amap.properties
          if [ -n "${AMAP_ANDROID_KEY:-}" ]; then
            echo "已注入 Android 端高德 Key"
          else
            echo "::warning::未配置 AMAP_ANDROID_KEY，APK 里的地图会显示为本地示意图"
          fi

      # 配了 ANDROID_KEYSTORE_BASE64 就用固定签名，否则退回 debug 签名。
      # 高德 Key 绑「包名 + 签名 SHA1」，debug keystore 由构建机现场生成，
      # 每次换 runner 都是新的 SHA1，用户注册好的 Key 会失效。
      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次用 debug 签名，\
          签名 SHA1 每次构建都会变；要让用户自己填高德 Key，需要固定签名"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=app/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          PROPS
          echo "已启用固定的 release 签名"

      - name: 拉依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试与 widget 测试
        run: flutter test

      - name: 构建 Release APK
        env:
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
          AMAP_IOS_KEY: ${{ secrets.AMAP_IOS_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=AMAP_ANDROID_KEY="${AMAP_ANDROID_KEY:-}" \
            --dart-define=AMAP_IOS_KEY="${AMAP_IOS_KEY:-}"
          ls -lh build/app/outputs/flutter-apk/

      # 把签名证书的 SHA1 打出来：到高德开放平台建 Key 时要填这个值。
      - name: 打印签名 SHA1
        run: |
          set -euo pipefail
          if [ -f android/key.properties ]; then
            store="android/app/release.jks"
            pass=$(grep '^storePassword=' android/key.properties | cut -d= -f2-)
            alias=$(grep '^keyAlias=' android/key.properties | cut -d= -f2-)
            echo "签名来源：固定的 release keystore（每次构建一致）"
          else
            store="$HOME/.android/debug.keystore"
            pass="android"
            alias="androiddebugkey"
            echo "签名来源：debug keystore（注意：每次构建都不一样）"
          fi
          keytool -list -v -keystore "$store" -storepass "$pass" -alias "$alias" \
            2>/dev/null | grep -E 'SHA1|SHA256' || echo "读不到证书指纹"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: location-marker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
