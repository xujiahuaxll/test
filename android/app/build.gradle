plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// 高德 Key 从 android/amap.properties 读取（该文件不进仓库）。
// 没有这个文件时占位为空串，编译照常通过，地图会退回本地示意图。
def amapProperties = new Properties()
def amapPropertiesFile = rootProject.file("amap.properties")
if (amapPropertiesFile.exists()) {
    amapPropertiesFile.withReader("UTF-8") { reader -> amapProperties.load(reader) }
}

android {
    namespace = "com.example.location_marker"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.location_marker"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // record 5.x / speech_to_text 需要 API 23 起
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders += [
            AMAP_ANDROID_KEY: amapProperties.getProperty("AMAP_ANDROID_KEY", "")
        ]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
