org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 关闭 R8（代码混淆 + 资源压缩）。
#
# Flutter 3.47 的 Gradle 插件默认给 release 打开 R8。但高德地图 SDK
# （com.amap.api:3dmap-location-search）是以 JAR 而不是 AAR 发布的，
# JAR 不携带 consumer ProGuard 规则，R8 于是把它的类改名重打包，而
# libAMapOpenMap.so 的 JNI_OnLoad 是按原始类名 FindClass 的
# （com/autonavi/amap/mapcore/MsgProcessor），找不到就直接 JNI abort，
# 打开地图必闪退。
#
# 这个包两百多兆，体积几乎全是原生库和语音模型（R8 根本不碰这些），
# 混淆省下的那点 Java 代码不值得冒这个险，所以整体关掉。想重新打开的话把这行改成 true，
# android/app/proguard-rules.pro 里已经备好了需要的 keep 规则。
shrink=false

# 别让 Flutter 的 Gradle 插件接管 ABI 过滤。
#
# FlutterPlugin.kt 的 configureAbiWithoutSplits 会无条件执行
#   abiFilters.clear(); abiFilters.addAll(PLATFORM_ABI_LIST)
# 也就是把 app/build.gradle.kts 里写的 abiFilters 整个抹掉，换成它自己那份
# （armeabi-v7a + arm64-v8a + x86_64）。它源码里的注释声称「用户自己设的
# 优先」，但代码并没有这么做——实测 x86_64 的库照样进包。
#
# 打开这个开关之后插件就不碰 abiFilters 了，由 build.gradle.kts 说了算。
# 代价：这个包从此装不进 x86 模拟器，真机不受影响。
disable-abi-filtering=true
