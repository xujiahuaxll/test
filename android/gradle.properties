org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 关闭 R8（代码混淆 + 资源压缩）。
#
# Flutter 3.47 的 Gradle 插件默认给 release 打开 R8。但高德地图 SDK
# （com.amap.api:3dmap-location-search）是以 JAR 而不是 AAR 发布的，
# JAR 不携带 consumer ProGuard 规则，R8 于是把它的类改名重打包，而
# libAMapOpenMap.so 的 JNI_OnLoad 是按原始类名 FindClass 的
# （com/autonavi/amap/mapcore/MsgProcessor），找不到就直接 JNI abort，
# 打开地图必闪退。
#
# 这个包 113MB，体积几乎全是高德的原生库（R8 根本不碰），混淆省下的那点
# Java 代码不值得冒这个险，所以整体关掉。想重新打开的话把这行改成 true，
# android/app/proguard-rules.pro 里已经备好了需要的 keep 规则。
shrink=false
